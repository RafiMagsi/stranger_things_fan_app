name: stranger_things_fan_app
description: "Unofficial Stranger Things fan companion - Hawkins vs. the Upside Down, with animated transitions, particles, trivia, and a synth soundboard."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Audio: soundboard + teaser stingers
  audioplayers: ^6.1.0
  # Local clip playback (drop-in trailers + capture clips in assets/video)
  video_player: ^2.10.0
  youtube_player_iframe: ^6.0.2
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    # Audio captured from the bundled fan clips (soundboard section).
    - assets/audio/captures/
    - assets/images/
    # Licensed photos (see lib/data/credits.dart); asset dirs aren't recursive.
    - assets/images/cast/
    - assets/images/filming/
    - assets/images/events/
    # Fan-media pack (tool/build_fan_media.py; credits in lib/data/fan_media.dart).
    - assets/images/reel/
    - assets/images/fan/
    - assets/video/

  fonts:
    # Grenze - a Benguiat-adjacent display serif for the title treatment.
    - family: Grenze
      fonts:
        - asset: assets/fonts/Grenze.ttf
          weight: 300
        - asset: assets/fonts/Grenze.ttf
          weight: 600
        - asset: assets/fonts/Grenze.ttf
          weight: 700
        - asset: assets/fonts/Grenze.ttf
          weight: 900

    # Space Grotesk - geometric retro-modern sans for UI copy.
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 700

    # Oswald - condensed grotesque for headlines and section titles (OFL).
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald.ttf

    # Special Elite - typewriter face for dossier/report flavor text.
    - family: SpecialElite
      fonts:
        - asset: assets/fonts/SpecialElite.ttf

# App icon: hollow neon "ST" (assets/icon, rendered by hand - not bundled).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  adaptive_icon_background: "#070405"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#070405"
    theme_color: "#E50914"
